<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>strudel dev</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #222; color: #fff; font: 14px monospace; }
    #bar { padding: 6px 12px; background: #000; display: flex; gap: 16px; }
    #status { color: #00FFD6; }
    #error { margin: 0; padding: 6px 12px; color: #FF4FD8; white-space: pre-wrap; }
    #start { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
      background: #000c; font-size: 20px; color: #00FFD6; cursor: pointer; }
  </style>
  <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
</head>
<body>
  <div id="bar"><span id="file"></span><span id="status">loading…</span></div>
  <p id="error"></p>
  <strudel-editor id="repl"></strudel-editor>
  <div id="start">click to start</div>

  <script>
    // Plays ?file= and plays it again each time it changes on disk. Run it with node dev.mjs.
    const file = new URLSearchParams(location.search).get('file')
    const repl = document.getElementById('repl')
    const status = msg => { document.getElementById('status').textContent = msg }

    // The log for nvim (<leader>ml): console.log in the sketch, errors, and play and stop go to the dev server.
    // The lines go every 200 ms, in one request, so they stay in order.
    const logLines = []
    const sendLog = text => logLines.push(new Date().toLocaleTimeString('en-GB') + '  ' + text)
    setInterval(() => {
      if (logLines.length === 0) return
      fetch('log', { method: 'POST', body: logLines.splice(0).join('\n') + '\n' })
        // Not with showError, which would send this error to the log again
        .catch(err => { document.getElementById('error').textContent = 'log: ' + err.message })
    }, 200)
    const consoleLog = console.log
    console.log = (...args) => {
      consoleLog(...args)
      // Strudel's own messages start with %c, for their colors. Only the sketch's messages go to the log.
      if (typeof args[0] === 'string' && args[0].startsWith('%c')) return
      sendLog(args.map(a => typeof a === 'object' && a !== null ? JSON.stringify(a) : String(a)).join(' '))
    }

    const showError = msg => {
      document.getElementById('error').textContent = msg
      if (msg) sendLog('error: ' + msg)
    }
    if (!file) throw showError('Add ?file=<name>.js to the URL')
    document.getElementById('file').textContent = file

    // The highlights for nvim: after each play, the positions of the mini-notation in the code ([line, UTF-16 column]
    // for the start and the end), and then the positions that play now, as the boxes that the browser editor draws.
    // The messages go in order, one request at a time. A new "active" message replaces an "active" message that did
    // not go yet.
    const highlightQueue = []
    let sendingHighlights = false
    function sendHighlight(message) {
      if ('active' in message && 'active' in (highlightQueue.at(-1) ?? {})) highlightQueue.pop()
      highlightQueue.push({ file, ...message })
      if (!sendingHighlights) sendHighlights()
    }
    async function sendHighlights() {
      sendingHighlights = true
      while (highlightQueue.length) {
        const body = highlightQueue.splice(0).map(m => JSON.stringify(m)).join('\n') + '\n'
        await fetch('highlights', { method: 'POST', body })
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status) })
          .catch(err => showError('highlights: ' + err.message))
      }
      sendingHighlights = false
    }

    let miniLocations = null
    let locationIndex = new Map() // 'start:end' -> its index in the positions that nvim has
    repl.addEventListener('update', e => {
      if (e.detail.evalError) showError(e.detail.evalError.message)
      // A new array after each play
      if (e.detail.miniLocations === miniLocations) return
      miniLocations = e.detail.miniLocations
      const code = e.detail.activeCode
      const lineStarts = [0]
      for (let i = 0; i < code.length; i++) if (code[i] === '\n') lineStarts.push(i + 1)
      const position = offset => {
        let line = lineStarts.length - 1
        while (lineStarts[line] > offset) line--
        return [line, offset - lineStarts[line]]
      }
      locationIndex = new Map(miniLocations.map(([start, end], i) => [start + ':' + end, i]))
      sendHighlight({ locations: miniLocations.map(([start, end]) => [...position(start), ...position(end)]) })
    })

    // The rule of the browser editor: a hap is active from its start to the end of its duration (scheduler.now()).
    // With timers, not requestAnimationFrame, which stops when the tab is not visible.
    let lastActive = ''
    let lastHighlightError = ''
    setInterval(() => {
      const { scheduler } = repl.editor.repl
      const active = new Set()
      try {
        if (scheduler.started && scheduler.pattern) {
          const now = scheduler.now()
          for (const hap of scheduler.pattern.queryArc(now, now + 0.001)) {
            if (!hap.whole || !hap.isActive(now)) continue
            for (const { start, end } of hap.context.locations ?? []) {
              const i = locationIndex.get(start + ':' + end)
              if (i !== undefined) active.add(i)
            }
          }
        }
      } catch (err) {
        if (err.message !== lastHighlightError) showError('highlights: ' + err.message)
        lastHighlightError = err.message
        return
      }
      const list = [...active].sort((a, b) => a - b)
      if (list.join() === lastActive) return
      lastActive = list.join()
      sendHighlight({ active: list })
    }, 16)

    let last = null
    let lib = '' // lib.ts without its types; play() runs it before the sketch, so its helpers are there
    let started = false // false after a stop, so a save does not start the sound again
    let audioReady = false
    async function fetchText(path) {
      const r = await fetch(path, { cache: 'no-store' })
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + path + ': ' + await r.text())
      return r.text()
    }
    async function load() {
      const [libCode, code] = await Promise.all([fetchText('lib.ts'), fetchText(file)])
      if (libCode + '\0' + code === last) return
      last = libCode + '\0' + code
      lib = libCode
      // The transpiler in @strudel/repl 1.3.0 needs an expression as the last statement (strudel.cc does not).
      // Strudel ignores this value, because the code plays its patterns with $:.
      repl.editor.setCode(code + '\nsilence\n')
      if (started) await play()
    }
    async function play() {
      showError('')
      try {
        (0, eval)(lib) // as a plain script, in global scope
      } catch (err) {
        return showError('lib.ts: ' + err.message)
      }
      await repl.editor.evaluate()
      // An error in the code does not throw here; the update event shows it, and the scheduler does not start
      status((repl.editor.repl.scheduler.started ? 'playing ' : 'not playing ') + new Date().toLocaleTimeString())
      sendLog('-- ' + (repl.editor.repl.scheduler.started ? 'playing ' : 'not playing ') + file)
    }

    document.getElementById('start').addEventListener('click', async e => {
      e.currentTarget.remove()
      status('starting…')
      await repl.editor.prebaked
      // The local copy of strudel.json, so samples that you did not push yet also play. Reload the page after you
      // add one. The base here replaces the GitHub _base in the file.
      await samples(await (await fetch('samples/strudel.json')).json(), location.origin + '/samples/')
      await initAudioOnFirstClick()
      audioReady = true
      started = true
      await play()
      setInterval(() => load().catch(err => showError(err.message)), 300)
    })

    // play and stop from the editor (POST /play, POST /stop), like Ctrl+Enter and Ctrl+.
    // toggle (POST /toggle) is stop when the page plays, and play when it does not (also after a play that failed).
    new EventSource('events?file=' + encodeURIComponent(file)).onmessage = async e => {
      try {
        if (!audioReady) throw new Error('Click the page once, so the browser lets it play sound')
        const command = e.data === 'toggle' ? (repl.editor.repl.scheduler.started ? 'stop' : 'play') : e.data
        if (command === 'play') {
          started = true
          last = null // play the file again, also if it did not change
          await load()
        } else if (command === 'stop') {
          started = false
          await repl.editor.stop()
          status('stopped ' + new Date().toLocaleTimeString())
          sendLog('-- stopped ' + file)
        }
      } catch (err) {
        showError(err.message)
      }
    }

    // The component made repl.editor when the parser connected it, above
    load()
      .then(() => status('ready'))
      .catch(err => showError(err.message))
  </script>
</body>
</html>
